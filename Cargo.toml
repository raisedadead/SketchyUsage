[package]
name = "sketchyusage"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Claude and Codex usage for SketchyBar, with a native panel"
repository = "https://github.com/raisedadead/SketchyUsage"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.190"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.8", features = ["runtime_shaders"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSScreen", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSArray"] }
block2 = "0.6"
