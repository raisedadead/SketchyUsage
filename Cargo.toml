[package]
name = "sketchyusage"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Claude and Codex usage for SketchyBar, with a native panel"
repository = "https://github.com/raisedadead/SketchyUsage"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
libc = "0.2.190"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
